/* NC.OS Theme: AUTO folgt dem System, DARK / LIGHT überschreiben es. */

html[data-mode="light"] {
  --bg: #ffffff;
  --surface: #f4f4f4;
  --surface-2: #ececec;
  --line: #d0d0d0;
  --text: #202020;
  --muted: #55606a;
  --faint: #7a858e;
  --gold: #a87800;
  --gold-soft: #8a6400;
  --cyan: #007aa8;
  --cyan-soft: #006a92;
  --ok: #008f4f;
  --warn: #bf8500;
  --bad: #d63232;
}

html[data-mode="dark"] {
  --bg: #0a0f18;
  --surface: #111827;
  --surface-2: #16202e;
  --line: #2d3748;
  --text: #ffffff;
  --muted: #9aa9b2;
  --faint: #8aa0b5;
  --gold: #e8b64c;
  --gold-soft: #f2d58a;
  --cyan: #4dd8ff;
  --cyan-soft: #a8e8ff;
  --ok: #39ff88;
  --warn: #ffcc44;
  --bad: #ff5a5a;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

a {
  color: inherit;
}

button, textarea {
  font: inherit;
}

::-moz-selection {
  background: var(--gold);
  color: #111;
}

::selection {
  background: var(--gold);
  color: #111;
}

.mono {
  font-family: inherit;
}

.gold {
  color: var(--gold);
}

.cyan {
  color: var(--cyan);
}

.muted {
  color: var(--muted);
}

.faint {
  color: var(--faint);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.codeblock {
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  line-height: 1.65;
}

.textarea-input {
  width: 100%;
  min-height: 210px;
  resize: vertical;
  background: #080b0d;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 16px;
  line-height: 1.6;
  outline: none;
}

.textarea-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(77,216,255,.14);
}

button:focus-visible, a:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.tree-line {
  position: relative;
}

.tree-line::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 34px;
  bottom: 6px;
  width: 1px;
  background: #24303a;
}

/* NC.OS Dashboard — Mobile First, Karten statt Textblock */

.nc-dashboard {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.nc-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  background: var(--surface);
}

.nc-card table {
  border-collapse: collapse;
  width: 100%;
}

.nc-card td {
  padding: 6px;
  border-top: 1px solid var(--line);
}

.nc-log {
  word-break: break-word;
  overflow-wrap: anywhere;
  margin-top: 4px;
}

.nc-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.ok {
  color: var(--ok);
}

.no {
  color: var(--bad);
}

.na {
  color: var(--warn);
}

.dim {
  color: var(--muted);
  font-size: 12px;
}

.touch-btn {
  min-height: 44px;
}

  body {

  h1 {

  };
